<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d12" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Live Interpreter" />
  <title>Live Interpreter</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">LOW LATENCY</div>
        <h1>Live Interpreter</h1>
      </div>
      <div id="status" class="status" data-state="idle"><span></span>停止中</div>
    </header>

    <section class="panel language-panel" aria-label="言語設定">
      <div class="language-box">
        <label for="sourceLanguage">話す言語</label>
        <select id="sourceLanguage"></select>
      </div>

      <button id="swapButton" class="swap-button" type="button" aria-label="言語を入れ替える">⇄</button>

      <div class="language-box">
        <label for="targetLanguage">訳す言語</label>
        <select id="targetLanguage"></select>
      </div>
    </section>

    <section class="control-card">
      <button id="startButton" class="primary-button" type="button">
        <span class="mic-dot"></span>
        <span id="startButtonText">通訳を開始</span>
      </button>
      <div class="meta-row">
        <span id="connectionMetric">WebRTC 直接接続</span>
        <button id="muteButton" class="text-button" type="button" disabled>翻訳音声をミュート</button>
      </div>
    </section>

    <section class="transcript-grid">
      <article class="transcript-card source-card">
        <div class="card-head">
          <span>原文</span>
          <button class="small-button" id="clearButton" type="button">消去</button>
        </div>
        <div id="sourceTranscript" class="transcript" aria-live="polite">ここに話した内容が表示されます。</div>
      </article>

      <article class="transcript-card translation-card">
        <div class="card-head">
          <span>リアルタイム翻訳</span>
          <span class="streaming-badge">STREAM</span>
        </div>
        <div id="translatedTranscript" class="transcript translated" aria-live="polite">翻訳は話している途中から表示されます。</div>
      </article>
    </section>

    <section class="tips">
      <strong>高速に使うコツ</strong>
      <span>イヤホン推奨。Wi‑Fi / 5Gで使用し、端末を話者に近づけてください。</span>
    </section>

    <audio id="translatedAudio" autoplay playsinline></audio>
  </main>

  <script type="module" src="/app.js"></script>
</body>
</html>
